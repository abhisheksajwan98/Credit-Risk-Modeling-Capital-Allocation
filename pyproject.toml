[project]
name = "credit-risk-intelligence"
version = "0.1.0"
description = "Graph-based credit risk modelling and reinforcement-learning lending decision system"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jenish Patel" }]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",          # not imported directly; pandas needs it for parquet
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "shap>=0.45",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
download = ["kagglehub>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "needs_torch: requires the optional torch dependency",
    "needs_real_data: requires the downloaded Lending Club dataset",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
